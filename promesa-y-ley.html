<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Cuaderno Scout</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Navegador con Hamburguesa -->
  <nav class="navbar navbar-expand-lg navegador">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="imagenes/flor-de-liz.png" alt="Flor de liz" class="logo" />
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse enlaces" id="navbarNavAltMarkup">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html">INICIO</a>
          <a class="nav-link" href="claves.html">CLAVES</a>
          <a class="nav-link" href="nuestra-historia.html">NUESTRA HISTORIA</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Título principal -->
  <header class="titulo">
    <h1>PROMESA Y LEY SCOUT</h1>
  </header>

  <!-- Contenido principal -->
  <section class="seccion-tarjetas">
    <div class="tarjeta">
      <img src="imagenes/promesa.png" alt="Ley scout" />
      <p>LEY SCOUT</p>
    </div>

    <div class="tarjeta">
      <img src="imagenes/ley-manada.jpg" alt="Ley de la manada" />
      <p>LEY DE LA MANADA</p>
    </div>

    <div class="tarjeta">
      <img src="imagenes/saludos.webp" alt="Saludos scout" />
      <p>SALUDO SCOUT, DE MANADA Y DE CASTORES</p>
    </div>

    <div class="tarjeta">
      <img src="imagenes/promesa.png" alt="Promesa Scout" />
      <p>PROMESA SCOUT</p>
    </div>
  </section>

  <!-- Formulario -->
  <section class="formulario">
    <form action="#" method="post">
      <fieldset>
        <legend>¿Tenés alguna sugerencia u opinión para darnos?</legend>

        <label for="Edad">Edad:</label>
        <input type="number" name="Edad" id="Edad" />

        <label for="Rama">Rama:</label>
        <input type="text" name="Rama" id="Rama" />

        <label for="Zona">Zona:</label>
        <input type="text" name="Zona" id="Zona" />

        <label for="Mail">Mail:</label>
        <input type="email" name="Mail" id="Mail" />

        <label for="Opinion">Te escuchamos:</label>
        <input type="text" name="Opinion" id="Opinion" />

        <input type="submit" value="Enviar" />
      </fieldset>
    </form>
  </section>

  <!-- Pie de página -->
   <footer class="pie-de-pagina">
    <p>2025 Cuaderno Scout</p>
    <P>SIEMPRE LISTA!</P>
  </footer>

  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
